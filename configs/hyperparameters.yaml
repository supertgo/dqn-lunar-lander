# Hiperparâmetros do DQN — configuração de referência (baseline) da busca.
# Cada sweep em configs/sweeps/ varia alguns destes valores a partir daqui.
# Ao fim da busca, atualize este arquivo com a melhor combinação encontrada.

# Otimização
learning_rate: 0.0005
learning_rate_end: null  # se definido, lr decai linearmente até este valor ao longo do treino
max_grad_norm: null  # se definido, limita a norma do gradiente (clipping)
gamma: 0.99  # fator de desconto
batch_size: 128

# Replay buffer
buffer_size: 100000
learning_starts: 5000  # passos aleatórios antes de começar a treinar

# Rede alvo
target_update_interval: 1000  # passos de ambiente entre cópias online -> alvo

# Exploração ε-greedy
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 50000

# Treino
total_timesteps: 300000
train_freq: 4  # 1 atualização de gradiente a cada N passos

# Arquitetura da rede Q
hidden_sizes: [256, 256]
