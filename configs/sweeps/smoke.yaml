# Teste rápido de ponta a ponta (fora do git: results/smoke/). Mede tempo e confere que nada quebra.
name: smoke
seeds: [0]
results_dir: results/smoke
variants:
  - total_timesteps: 30000
    learning_starts: 1000
    epsilon_decay_steps: 10000
evaluation:
  eval_freq: 5000
  eval_episodes: 5
  final_eval_episodes: 10
